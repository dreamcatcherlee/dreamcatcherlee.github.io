<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#FAF8F5" />
<title>Время для тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF8F5;--card:#fff;--ink:#232220;--muted:#78736A;--line:#E6E0D6;--accent:#8C7A5B;--soft:#F2EDE4;--done:#7D8F76}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:300;line-height:1.55;min-height:100vh;display:flex;justify-content:center;padding:20px 16px 48px}
.app{width:100%;max-width:440px}
header{text-align:center;margin-bottom:24px;padding-top:8px}
.line-art{width:68px;height:52px;margin:0 auto 8px;display:block;stroke:var(--ink);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:30px}
.subtitle{font-size:13px;color:var(--muted);margin-top:4px}
.week-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:20px}
.week-header{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:12px}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day-item{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.day-dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.day-item.today .day-dot{border-color:var(--accent)}
.day-item.completed .day-dot{background:var(--done);border-color:var(--done)}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);padding:4px;border-radius:14px;margin-bottom:20px}
.mode-btn{border:none;background:transparent;min-height:48px;padding:10px 8px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:300;color:var(--muted);cursor:pointer;transition:all .25s}
.mode-btn.active{background:var(--card);color:var(--ink);font-weight:400;box-shadow:0 2px 8px rgba(35,34,32,.05)}
.steps-list{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.step-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;transition:border-color .3s}
.step-card.done{border-color:var(--done);background:#FCFDFB}
.step-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.step-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-weight:600;line-height:1.25;margin-bottom:6px}
.step-desc{font-size:14px;color:var(--muted);margin-bottom:14px}
.check-btn{width:44px;height:44px;min-width:44px;margin:-8px -8px 0 0;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.check-btn span{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px;transition:all .2s}
.step-card.done .check-btn span{background:var(--done);border-color:var(--done);color:#fff}
.timer-row{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line)}
.timer-display{font-variant-numeric:tabular-nums;font-size:16px;font-weight:400}
.timer-btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;padding:0 20px;border-radius:22px;font-family:inherit;font-size:14px;cursor:pointer}
.timer-btn.running{background:var(--accent);color:#fff;border-color:var(--accent)}
.breath-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;margin-bottom:22px}
.breath-circle-wrap{height:130px;display:flex;align-items:center;justify-content:center;margin:8px 0}
.breath-circle{width:64px;height:64px;border-radius:50%;border:1.2px solid var(--accent);background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;transition:transform 4s ease-in-out}
.breath-circle.inhale{transform:scale(1.65)}
.breath-circle.exhale{transform:scale(1);transition-duration:6s}
.note-card{background:var(--soft);border-radius:18px;padding:20px;text-align:center}
.note-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.note-text{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:21px;line-height:1.35;margin-bottom:14px}
.note-btn{background:transparent;border:1px solid var(--accent);color:var(--ink);min-height:44px;padding:0 20px;border-radius:22px;font-family:inherit;font-size:14px;cursor:pointer}
.note-btn:active{background:var(--card)}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="line-art" viewBox="0 0 100 75" aria-hidden="true">
      <path d="M20,68 C38,66 50,54 50,16 M50,48 C40,44 34,36 36,26 C44,28 49,36 50,48 M50,38 C58,36 66,28 64,18 C56,20 51,28 50,38"/>
    </svg>
    <h1>Время для тебя</h1>
    <p class="subtitle">5 минут тишины и бережной заботы о себе</p>
  </header>

  <section class="week-card">
    <div class="week-header"><span>Эта неделя</span><span>Без спешки и правил</span></div>
    <div class="days-grid" id="days-grid"></div>
  </section>

  <div class="mode-switch">
    <button class="mode-btn" id="btn-morning" data-mode="morning">Утро · Включиться</button>
    <button class="mode-btn" id="btn-evening" data-mode="evening">Вечер · Выдохнуть</button>
  </div>

  <div class="steps-list" id="steps-list"></div>

  <section class="breath-box" id="breath-box" hidden>
    <div class="step-title">Мягкое дыхание для сна</div>
    <p class="step-desc" style="margin-bottom:4px">Дыши спокойно, без усилия. Вдох через нос, долгий выдох.</p>
    <div class="breath-circle-wrap"><div class="breath-circle" id="breath-circle">Пауза</div></div>
    <button class="timer-btn" id="breath-btn">Начать 1 минуту</button>
  </section>

  <section class="note-card">
    <div class="note-label">Напоминание для тебя</div>
    <div class="note-text" id="note-text"></div>
    <button class="note-btn" id="note-btn">Ещё одна мысль</button>
  </section>
</div>

<script>
/* ============ 1. ВПИШИ СВОИ ФРАЗЫ ЗДЕСЬ ============
   Каждая фраза — в кавычках, в конце запятая. Можно добавлять и удалять. */
const COMPLIMENTS = [
  "Ты сегодня уже сделала достаточно. Теперь 5 минут только для тебя.",
  "Красота — это не цифры, а когда у тебя расправлены плечи и спокойный взгляд.",
  "Ты невероятно сильная и красивая женщина. Я очень тобой горжусь.",
  "Даже если нас разделяют километры, я всегда рядом и на твоей стороне.",
  "Можно ничего не успеть. Ты всё равно молодец."
];

/* ============ 2. УПРАЖНЕНИЯ (можно править тексты и секунды) ============
   seconds — длительность таймера. Все движения лёгкие, без наклонов и скруток. */
const STEPS = {
  morning: [
    {id:"m1", title:"Стакан воды", desc:"Выпей воду небольшими глотками. Организм проснётся мягко.", seconds:60},
    {id:"m2", title:"Шея: «да» и «нет»", desc:"Сидя, очень медленно и в небольшом размахе: кивни вниз-вверх несколько раз, затем поверни голову влево-вправо. Только в комфортных пределах.", seconds:60},
    {id:"m3", title:"Плечи вверх и назад", desc:"Подними плечи к ушам, плавно отведи назад и опусти. Медленно, как будто раскрываешь крылья.", seconds:60},
    {id:"m4", title:"Кисти и стопы", desc:"Сожми и разожми пальцы рук, покрути кистями. Потом покрути стопами в обе стороны.", seconds:60}
  ],
  evening: [
    {id:"e1", title:"Шея и плечи", desc:"Сидя, опусти плечи и дай голове мягко «стечь» чуть вниз и в сторону — совсем немного, без усилия. Затем наоборот.", seconds:60},
    {id:"e2", title:"Руки: разгрузка", desc:"Потряси кистями, легко потяни пальцы, покрути запястьями. Расслабь предплечья.", seconds:60},
    {id:"e3", title:"Отдых для поясницы", desc:"Лёжа на спине, согни колени, стопы стоят на кровати. Руки вдоль тела. Просто лежи и дыши. Без подтягивания коленей и без напряжения живота.", seconds:90},
    {id:"e4", title:"Стопы лёжа", desc:"Лёжа, мягко покачай стопами на себя и от себя, затем покрути ими. Потом отпусти ноги.", seconds:60}
  ]
};

/* ============ ДАЛЬШЕ КОД. МОЖНО НЕ ТРОГАТЬ ============ */
const STORE_KEY = "time-for-you-v1";
const DAYS = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
let mode = "morning";
let timers = {};
let audioCtx = null;
let lastNote = -1;

/* --- безопасное хранение --- */
function loadData(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return memoryData; }
}
let memoryData = {};
function saveData(d){
  memoryData = d;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch(e){}
}
function dateKey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* --- звук (тихий, без файлов) --- */
function getAudio(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  } catch(e){ return null; }
}
function softBeep(){
  const ctx = getAudio();
  if(!ctx) return;
  [528, 660].forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t = ctx.currentTime + i * 0.35;
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 1.3);
  });
}

/* --- неделя --- */
function renderWeek(){
  const data = loadData();
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const grid = document.getElementById("days-grid");
  grid.innerHTML = "";
  DAYS.forEach((name, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const key = dateKey(d);
    const rec = data[key] || {};
    const any = Object.values(rec).some(v => v);
    const item = document.createElement("div");
    item.className = "day-item" + (key === dateKey(now) ? " today" : "") + (any ? " completed" : "");
    item.innerHTML = '<div class="day-dot">' + (any ? "✓" : "") + '</div><span>' + name + "</span>";
    grid.appendChild(item);
  });
}

/* --- карточки --- */
function fmt(s){ return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }

function stopTimer(id){
  if(timers[id]){ clearInterval(timers[id].h); delete timers[id]; }
}
function stopAllTimers(){ Object.keys(timers).forEach(stopTimer); }

function renderSteps(){
  stopAllTimers();
  const list = document.getElementById("steps-list");
  list.innerHTML = "";
  const rec = loadData()[dateKey(new Date())] || {};
  STEPS[mode].forEach(step => {
    const card = document.createElement("div");
    card.className = "step-card" + (rec[step.id] ? " done" : "");
    card.innerHTML =
      '<div class="step-top"><div><div class="step-title"></div><p class="step-desc"></p></div>' +
      '<button class="check-btn" aria-label="Отметить"><span>✓</span></button></div>' +
      '<div class="timer-row"><span class="timer-display">' + fmt(step.seconds) +
      '</span><button class="timer-btn">Старт</button></div>';
    card.querySelector(".step-title").textContent = step.title;
    card.querySelector(".step-desc").textContent = step.desc;

    card.querySelector(".check-btn").addEventListener("click", () => {
      const data = loadData(), k = dateKey(new Date());
      data[k] = data[k] || {};
      data[k][step.id] = !data[k][step.id];
      saveData(data);
      card.classList.toggle("done", !!data[k][step.id]);
      renderWeek();
    });

    const disp = card.querySelector(".timer-display");
    const btn = card.querySelector(".timer-btn");
    btn.addEventListener("click", () => {
      getAudio();
      if(timers[step.id]){
        stopTimer(step.id);
        disp.textContent = fmt(step.seconds);
        btn.textContent = "Старт"; btn.classList.remove("running");
        return;
      }
      let left = step.seconds;
      btn.textContent = "Пауза"; btn.classList.add("running");
      timers[step.id] = { h: setInterval(() => {
        left--;
        disp.textContent = fmt(Math.max(left,0));
        if(left <= 0){
          stopTimer(step.id);
          softBeep();
          disp.textContent = fmt(step.seconds);
          btn.textContent = "Старт"; btn.classList.remove("running");
        }
      }, 1000) };
    });
    list.appendChild(card);
  });
}

/* --- режимы --- */
function setMode(m){
  mode = m;
  document.getElementById("btn-morning").classList.toggle("active", m === "morning");
  document.getElementById("btn-evening").classList.toggle("active", m === "evening");
  document.getElementById("breath-box").hidden = (m !== "evening");
  if(m !== "evening") stopBreath();
  renderSteps();
}

/* --- дыхание: вдох 4 с, выдох 6 с, 6 циклов = 1 минута --- */
let breathTimer = null, breathRunning = false;
function stopBreath(){
  breathRunning = false;
  clearTimeout(breathTimer);
  const c = document.getElementById("breath-circle");
  c.className = "breath-circle"; c.textContent = "Пауза";
  const b = document.getElementById("breath-btn");
  b.textContent = "Начать 1 минуту"; b.classList.remove("running");
}
function toggleBreath(){
  if(breathRunning){ stopBreath(); return; }
  getAudio();
  breathRunning = true;
  const c = document.getElementById("breath-circle");
  const b = document.getElementById("breath-btn");
  b.textContent = "Остановить"; b.classList.add("running");
  let cycles = 0;
  function inhale(){
    if(!breathRunning) return;
    c.className = "breath-circle inhale"; c.textContent = "Вдох";
    breathTimer = setTimeout(exhale, 4000);
  }
  function exhale(){
    if(!breathRunning) return;
    c.className = "breath-circle exhale"; c.textContent = "Выдох";
    breathTimer = setTimeout(() => {
      cycles++;
      if(cycles >= 6){ stopBreath(); softBeep(); } else inhale();
    }, 6000);
  }
  c.className = "breath-circle exhale";
  setTimeout(inhale, 50);
}

/* --- фразы --- */
function nextCompliment(){
  if(!COMPLIMENTS.length) return;
  let i;
  do { i = Math.floor(Math.random() * COMPLIMENTS.length); }
  while(COMPLIMENTS.length > 1 && i === lastNote);
  lastNote = i;
  document.getElementById("note-text").textContent = COMPLIMENTS[i];
}

/* --- запуск --- */
document.getElementById("btn-morning").addEventListener("click", () => setMode("morning"));
document.getElementById("btn-evening").addEventListener("click", () => setMode("evening"));
document.getElementById("breath-btn").addEventListener("click", toggleBreath);
document.getElementById("note-btn").addEventListener("click", nextCompliment);

renderWeek();
nextCompliment();
setMode(new Date().getHours() < 15 ? "morning" : "evening"); /* до 15:00 — утро, дальше — вечер */
</script>
</body>
</html>
